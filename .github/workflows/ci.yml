name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Deliberately no --extra audio and no --extra embeddings: those pull in
      # torch, CUDA wheels and a native audio stack. The fact store takes an
      # injected Embedder, and the audio logic worth testing lives in modules
      # that import neither sounddevice nor kokoro-onnx, so the whole suite
      # runs without any of it -- 94 tests, 0 skipped.
      #
      # The dev dependency group installs by default; it needs no flag.
      - name: Install
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src

      - name: Test
        run: uv run pytest
