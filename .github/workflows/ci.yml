name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Deliberately no --extra audio and no --extra embeddings: those pull in
      # torch, CUDA wheels and a native audio stack. The fact store takes an
      # injected Embedder and the audio tests skip themselves, so the whole
      # suite runs without any of it.
      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src

      - name: Test
        run: uv run pytest
